[project]
name = "natsune"
version = "0.1.0"
description = "Higher Order Concurrency in python"
requires-python = ">=3.14"
authors = [{ name = "Zachary Collins", email = "recursive.cookie.jar@gmail.com" }]
license = { text = "Apache-2" }
dependencies = [
    "karakuri",
    "ty>=0.0.49",
]

[project.scripts]

[project.optional-dependencies]
dev = [
    "ty>=0.0.61",
    "black>=26.5.1",
    "isort>=6.0.0",
    "pytest>=9.1.1",
    "pre-commit>=4.0.0"
]

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natsune"]

[tool.hatch.build.hooks.custom]
path = "build_hooks.py"

[dependency-groups]
dev = []

# Black code formatter configuration
[tool.black]
line-length = 88
target-version = ["py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

# isort import sorting configuration
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["natsune"]
known_third_party = ["ty"]
skip_gitignore = true

# pytest configuration
[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
testpaths = ["tests", "src"]

[tool.uv.sources]
karakuri = { git = "https://codeberg.org/kazuya/karakuri.git" }
