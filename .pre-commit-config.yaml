repos:
  - repo: local
    hooks:
      # Black code formatting check
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        args: [--check, --diff]
        # Only check Python files in src/ directory
        files: ^src/.*\.py$
        
      # isort import sorting
      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]
        args: [--check-only, --diff]
        files: ^src/.*\.py$

      # ty type checking
      - id: ty
        name: ty
        entry: ty
        language: system
        types: [python]
        args: [check]
